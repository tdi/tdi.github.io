<pre class="mermaid">{{ .Inner | htmlEscape | safeHTML }}</pre>
{{- if not (.Page.Store.Get "mermaidLoaded") }}
{{- .Page.Store.Set "mermaidLoaded" true }}
<style>
  pre.mermaid {
    background: transparent;
    display: flex;
    justify-content: center;
    overflow-x: auto;
  }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const getTheme = () =>
    document.body.classList.contains("dark") ? "dark" : "default";
  document.querySelectorAll("pre.mermaid").forEach((el) => {
    el.dataset.src = el.textContent;
  });
  const render = async () => {
    document.querySelectorAll("pre.mermaid").forEach((el) => {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.src;
    });
    mermaid.initialize({ startOnLoad: false, theme: getTheme() });
    await mermaid.run({ querySelector: "pre.mermaid" });
  };
  await render();
  // PaperMod theme toggle flips body class; re-render diagrams to match
  document
    .getElementById("theme-toggle")
    ?.addEventListener("click", () => setTimeout(render, 60));
</script>
{{- end }}
