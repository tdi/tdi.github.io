<svg viewBox="0 0 720 420" width="100%" style="max-width:720px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ses-title">
  <title id="ses-title">Animated anatomy of an MCP session: initialize handshake, capability discovery, then a tool call with progress and result</title>
  <style>
    .ses-actor { fill: var(--code-bg, #f2f2f2); stroke: var(--border, #ccc); rx: 6; }
    .ses-name { font: 600 13.5px ui-sans-serif, system-ui, sans-serif; fill: var(--content, #333); text-anchor: middle; }
    .ses-sub { font: italic 11px ui-sans-serif, system-ui, sans-serif; fill: var(--content, #333); text-anchor: middle; opacity: 0.75; }
    .ses-life { stroke: var(--border, #ccc); stroke-dasharray: 4 4; }
    .ses-msg { stroke: #7f8ea3; stroke-width: 1.5; marker-end: url(#ses-arrow); }
    .ses-reply { stroke-dasharray: 5 4; }
    .ses-lbl { font: 12px ui-sans-serif, system-ui, sans-serif; fill: var(--content, #333); text-anchor: middle;
               paint-order: stroke; stroke: var(--theme, #fff); stroke-width: 4px; stroke-linejoin: round; }
    .ses-band { fill: #7aa2f7; opacity: 0.07; rx: 8; }
    .ses-band-lbl { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: #7aa2f7; letter-spacing: 1px; }
    .ses-chip-txt { font: 700 10.5px ui-sans-serif, system-ui, sans-serif; fill: #0b1220; text-anchor: middle; }
    .ses-b1 { animation: ses-b1 16s linear infinite; }
    .ses-b2 { animation: ses-b2 16s linear infinite; }
    .ses-b3 { animation: ses-b3 16s linear infinite; }
    .ses-s1 { animation: ses-s1 16s linear infinite; }
    .ses-s2 { animation: ses-s2 16s linear infinite; }
    .ses-s3 { animation: ses-s3 16s linear infinite; }
    .ses-s4 { animation: ses-s4 16s linear infinite; }
    .ses-s5 { animation: ses-s5 16s linear infinite; }
    .ses-s6 { animation: ses-s6 16s linear infinite; }
    .ses-s7 { animation: ses-s7 16s linear infinite; }
    .ses-s8 { animation: ses-s8 16s linear infinite; }
    .ses-chip-call { animation: ses-chip-call 16s linear infinite; }
    .ses-chip-res { animation: ses-chip-res 16s linear infinite; }
    @keyframes ses-b1 { 0%, 1% { opacity: 0; } 3%, 96% { opacity: 0.07; } 100% { opacity: 0; } }
    @keyframes ses-b2 { 0%, 26% { opacity: 0; } 28%, 96% { opacity: 0.07; } 100% { opacity: 0; } }
    @keyframes ses-b3 { 0%, 44% { opacity: 0; } 46%, 96% { opacity: 0.07; } 100% { opacity: 0; } }
    @keyframes ses-s1 { 0%, 4% { opacity: 0; } 6%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s2 { 0%, 12% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s3 { 0%, 20% { opacity: 0; } 22%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s4 { 0%, 30% { opacity: 0; } 32%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s5 { 0%, 38% { opacity: 0; } 40%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s6 { 0%, 50% { opacity: 0; } 52%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s7 { 0%, 62% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-s8 { 0%, 72% { opacity: 0; } 74%, 96% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes ses-chip-call {
      0%, 50% { opacity: 0; transform: translate(200px, 307px); }
      52% { opacity: 1; transform: translate(200px, 307px); }
      58% { transform: translate(520px, 307px); }
      66% { opacity: 1; transform: translate(520px, 307px); }
      70%, 100% { opacity: 0; transform: translate(520px, 307px); }
    }
    @keyframes ses-chip-res {
      0%, 72% { opacity: 0; transform: translate(520px, 377px); }
      74% { opacity: 1; transform: translate(520px, 377px); }
      80% { transform: translate(200px, 377px); }
      96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ses-b1, .ses-b2, .ses-b3, .ses-s1, .ses-s2, .ses-s3, .ses-s4,
      .ses-s5, .ses-s6, .ses-s7, .ses-s8, .ses-chip-call, .ses-chip-res { animation: none !important; }
    }
  </style>
  <defs>
    <marker id="ses-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8ea3"/>
    </marker>
  </defs>

  <rect class="ses-actor" x="110" y="12" width="180" height="42"/>
  <text class="ses-name" x="200" y="29">MCP Client</text>
  <text class="ses-sub" x="200" y="45">inside the host app</text>
  <rect class="ses-actor" x="430" y="12" width="180" height="42"/>
  <text class="ses-name" x="520" y="29">MCP Server</text>
  <text class="ses-sub" x="520" y="45">tools, resources, prompts</text>

  <line class="ses-life" x1="200" y1="54" x2="200" y2="408"/>
  <line class="ses-life" x1="520" y1="54" x2="520" y2="408"/>

  <g class="ses-b1">
    <rect class="ses-band" x="55" y="72" width="610" height="110"/>
    <text class="ses-band-lbl" x="66" y="88">1 · HANDSHAKE</text>
  </g>
  <g class="ses-b2">
    <rect class="ses-band" x="55" y="188" width="610" height="72"/>
    <text class="ses-band-lbl" x="66" y="204">2 · DISCOVERY</text>
  </g>
  <g class="ses-b3">
    <rect class="ses-band" x="55" y="266" width="610" height="130"/>
    <text class="ses-band-lbl" x="66" y="282">3 · WORK</text>
  </g>

  <g class="ses-s1">
    <line class="ses-msg" x1="200" y1="105" x2="514" y2="105"/>
    <text class="ses-lbl" x="360" y="99">initialize (version, my capabilities)</text>
  </g>
  <g class="ses-s2">
    <line class="ses-msg ses-reply" x1="520" y1="138" x2="206" y2="138"/>
    <text class="ses-lbl" x="360" y="132">here are mine (tools, resources, prompts)</text>
  </g>
  <g class="ses-s3">
    <line class="ses-msg" x1="200" y1="170" x2="514" y2="170"/>
    <text class="ses-lbl" x="360" y="164">notifications/initialized</text>
  </g>
  <g class="ses-s4">
    <line class="ses-msg" x1="200" y1="216" x2="514" y2="216"/>
    <text class="ses-lbl" x="360" y="210">tools/list</text>
  </g>
  <g class="ses-s5">
    <line class="ses-msg ses-reply" x1="520" y1="248" x2="206" y2="248"/>
    <text class="ses-lbl" x="360" y="242">tool definitions (names, schemas)</text>
  </g>
  <g class="ses-s6">
    <line class="ses-msg" x1="200" y1="295" x2="514" y2="295"/>
    <text class="ses-lbl" x="360" y="289">tools/call: search_issues(query)</text>
  </g>
  <g class="ses-s7">
    <line class="ses-msg ses-reply" x1="520" y1="330" x2="206" y2="330"/>
    <text class="ses-lbl" x="360" y="324">notifications/progress (working...)</text>
  </g>
  <g class="ses-s8">
    <line class="ses-msg ses-reply" x1="520" y1="365" x2="206" y2="365"/>
    <text class="ses-lbl" x="360" y="359">result (content + structured data)</text>
  </g>

  <g class="ses-chip-call" transform="translate(520, 307)" opacity="0">
    <rect x="-30" y="-10" width="60" height="20" rx="6" fill="#7aa2f7"/>
    <text class="ses-chip-txt" x="0" y="4">CALL</text>
  </g>
  <g class="ses-chip-res" transform="translate(200, 377)">
    <rect x="-34" y="-10" width="68" height="20" rx="6" fill="#9ece6a"/>
    <text class="ses-chip-txt" x="0" y="4">RESULT</text>
  </g>
</svg>
